name: Pruebas EaZyStock

on:

  push:

    branches:

      - main

  pull_request:

    branches:

      - main

jobs:

  pruebas:

    runs-on: ubuntu-latest

    steps:

    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Instalar PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Mostrar versión PHP
      run: php -v

    - name: Verificar sintaxis PHP
      run: |

        find . -name "*.php" -print0 |

        xargs -0 -n1 php -l